    <!-- CRITICAL: Override Page Visibility API BEFORE any scripts load.
         This prevents YouTube iframe from detecting background state and pausing audio.
         Must run FIRST, before YouTube iframe_api loads. -->
    <script>
      (function(){
        try {
          // Make document always appear visible
          Object.defineProperty(document, 'hidden', { get: function(){ return false; }, configurable: true });
          Object.defineProperty(document, 'visibilityState', { get: function(){ return 'visible'; }, configurable: true });
          Object.defineProperty(document, 'webkitHidden', { get: function(){ return false; }, configurable: true });
          
          // Intercept visibilitychange event listeners so they never fire
          var _origAddEventListener = EventTarget.prototype.addEventListener;
          EventTarget.prototype.addEventListener = function(type, fn, opts) {
            if (type === 'visibilitychange' || type === 'webkitvisibilitychange') {
              // Don't register this listener at all
              return;
            }
            return _origAddEventListener.call(this, type, fn, opts);
          };
          
          // Also block the dispatchEvent for visibilitychange
          var _origDispatchEvent = EventTarget.prototype.dispatchEvent;
          EventTarget.prototype.dispatchEvent = function(event) {
            if (event && (event.type === 'visibilitychange' || event.type === 'webkitvisibilitychange')) {
              return true; // swallow the event
            }
            return _origDispatchEvent.call(this, event);
          };
        } catch(e) {}
      })();
    </script>
